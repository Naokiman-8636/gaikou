# 盛岡市周辺の小児科マスタデータ
#
# 2026-11 時点で公開情報（医療機関検索サイト・市の資料・各院HP）をもとに作成。
# 「verified: false」の項目は未確認です。来院前に必ず電話または公式HPで確認してください。
#
# 各フィールド:
#   id               : 一意なID（英数字）
#   name             : 医院名
#   area             : 市町村 + 地区
#   address / phone  : 住所 / 電話
#   homepage         : 公式HP（不明なら null）
#   reservation_url  : 順番受付・予約ページ（分かっていれば指定。null なら HP から自動検出）
#   pediatric_only   : 小児科専門なら true（内科併設・総合病院は false）
#   saturday         : 土曜診療あり
#   web_reservation  : Web予約/順番受付あり
#   reviews          : 口コミ取得元。caloo_url / epark_url / google_query
#   manual_rating    : 自動取得できない場合の手入力 {rating: 4.0, count: 10, source: "..."}
#   notes            : メモ
#
# 新しい医院は末尾に追記するだけで、次回の更新から反映されます。

