function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);

  for (const k of kids.flat()) if (k != null) n.append(k);

  const [label, cls] = STATE[st.state] || ["?","b-warn"];
  const badge = label + (st.waiting != null ? `・待ち${st.waiting}人` : "");
  const tags = [["小児科専門",c.pediatric_only],["Web受付",c.web_reservation],["土曜診療",c.saturday]]
    .filter(t => t[1]).map(t => el("span",{class:"tag",text:t[0]}));
  const rating = c.rating
    ? [el("span",{class:"star",text:"★"+c.rating}), el("small",{text:`（${c.review_count}件）`})]
    : [el("small",{class:"muted",text:"口コミ未取得"})];
  const srcs = (c.reviews || []).filter(r => r.url).map(r => [" ", el("a",{href:r.url,target:"_blank",rel:"noopener",text:r.source})]);

  const actions = [];
  const res = st.source_url && st.source_url !== c.homepage ? st.source_url : null;
  if (res) actions.push(el("a",{class:"btn primary",href:res,target:"_blank",rel:"noopener",text:"受付ページ"}));
  actions.push(el("a",{class:"btn" + (res ? "" : " primary"),href:mapUrl(c),target:"_blank",rel:"noopener",text:"地図"}));
  if (c.homepage) actions.push(el("a",{class:"btn",href:c.homepage,target:"_blank",rel:"noopener",text:"公式HP"}));

  let tel = null;
  if (c.phone) {
    const b = el("button",{type:"button",class:"btn",text:"番号をコピー"});
    b.addEventListener("click", () => copyTel(b, c.phone));
    tel = el("div",{class:"tel"}, el("small",{class:"muted",text:"電話"}), el("span",{text:c.phone}), b);
  }
  const bd = Object.entries(c.breakdown || {}).map(([k,v]) => el("li",{}, k+" ", el("b",{text:String(v)})));
  const sys = st.system ? `（${st.system}）` : "";

  const n = el("article",{class:"card","data-area":(c.area||"").split(" ")[0],"data-state":st.state},
    el("div",{class:"top"},
      el("h2",{}, el("span",{class:"rank",text:String(rank)}), c.name),
      el("span",{class:"badge "+cls,text:badge})),
    el("p",{class:"sub",text:c.area || ""}),
    tags.length ? el("div",{class:"tags"},tags) : null,
    st.message && data.status_checked ? el("p",{class:"status",text:st.message + sys}) : null,
    el("div",{class:"meta"},
      el("span",{class:"score"}, el("b",{text:String(c.score)}), "点"),
      el("span",{}, rating, srcs)),
    el("div",{class:"actions"}, actions),
    tel,
    el("details",{}, el("summary",{text:"点数の内訳・メモ"}), el("ul",{class:"bd"},bd),
      c.notes ? el("p",{class:"notes",text:c.notes}) : null)
  );
  return n;
}

function render(){
  if (!data) return;
  const area = $("area").value, only = $("onlyopen").checked;
  const list = [...data.clinics].sort((a,b) => sort === "now" ? a.now_rank - b.now_rank : b.score - a.score);
  const shown = list.filter(c => (!area || (c.area||"").split(" ")[0] === area) && (!only || c.status?.state === "accepting"));
  $("list").replaceChildren(...shown.map((c,i) => card(c, i + 1)));
  $("empty").hidden = shown.length > 0;
  document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  store.set("sort", sort); store.set("area", area); store.set("onlyopen", only ? "1" : "0");
  ago();
}

function fillAreas(){
  const sel = $("area"), keep = store.get("area") || sel.value;
  const areas = [...new Set(data.clinics.map(c => (c.area||"").split(" ")[0]))].sort();
  sel.replaceChildren(el("option",{value:"",text:"全エリア"}), ...areas.map(a => el("option",{value:a,text:a})));
  sel.value = areas.includes(keep) ? keep : "";
}

function ago(){
  if (!data) return;
  const gen = data.generated_at, at = new Date(gen.replace(" ","T") + ":00+09:00");
  const m = Math.round((Date.now() - at) / 60000);
  const txt = m < 1 ? "たった今" : m < 60 ? m + "分前" : m < 1440 ? Math.floor(m/60) + "時間前" : Math.floor(m/1440) + "日前";
  const jst = new Date(Date.now() + 9*3600e3), h = jst.getUTCHours() + jst.getUTCMinutes()/60, d = jst.getUTCDay();
  const open = d !== 0 && h >= 8.5 && h < 18.5;
  const stale = data.status_checked && open && m > 75;
  $("upd").textContent = `データ: ${txt}（${gen.slice(5)}）`;
  $("upd").classList.toggle("stale", stale);
  const n = $("notice");
  if (!data.status_checked) {
    n.hidden = false;
    n.textContent = "受付状況はまだ取得していません。医院の情報・口コミ・おすすめ度だけを表示しています。受付状況は各医院の受付ページか電話で確認してください。";
  } else if (stale) {
    n.hidden = false;
    n.textContent = `受付状況は${txt}のものです。今は変わっている可能性があります。`;
  } else n.hidden = true;
}

document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { sort = b.dataset.sort; render(); }));
$("area").addEventListener("change", render);
$("onlyopen").addEventListener("change", render);
$("onlyopen").checked = store.get("onlyopen") === "1";
if (data) { fillAreas(); render(); }
setInterval(ago, 60000);

// 最新データは共有データベースの snapshot/latest に入る（Claude が更新）。届けば差し替える
(async () => {
  const db = await window.claude?.use?.("db").catch(() => null);
  if (!db) { $("live").textContent = "保存版を表示中"; return; }
  $("live").textContent = "最新データを確認中…";
  const timer = setTimeout(() => { $("live").textContent = "保存版を表示中"; }, 10000);
  db.doc("snapshot/latest").onSnapshot(snap => {
    clearTimeout(timer);
    if (snap.exists && snap.data()?.clinics?.length) {
      data = snap.data();
      fillAreas(); render();
      $("live").textContent = "自動で最新に更新";
    } else {
      $("live").textContent = "保存版を表示中";
    }
  }, () => { clearTimeout(timer); $("live").textContent = "保存版を表示中"; });
})();
</script>
